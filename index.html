<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavern Card Hub - 酒馆卡片与文档仓库</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Mammoth.js for docx -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.2s; }
        .glass-card:hover { border-color: rgba(99, 102, 241, 0.4); transform: translateY(-2px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.6); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation -->
    <header class="glass h-16 px-6 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-600/30 rounded-xl border border-indigo-500/30 text-indigo-400">
                <i data-lucide="box" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-100 flex items-center gap-2">
                    Tavern Card Hub
                    <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">V1.0</span>
                </h1>
                <p class="text-xs text-slate-400">酒馆角色卡、世界书、正则与文档管理中心</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span>导入资产</span>
                <input type="file" id="fileInput" multiple accept=".png,.json,.txt,.docx" class="hidden">
            </label>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Tabs -->
        <aside class="w-64 glass border-r border-slate-800/80 p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-1">
                <div class="text-xs font-semibold text-slate-500 px-3 py-2 uppercase tracking-wider">资产分类</div>
                
                <button onclick="switchTab('cards')" id="tab-cards" class="tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition active">
                    <div class="flex items-center gap-3">
                        <i data-lucide="users" class="w-4 h-4 text-indigo-400"></i>
                        <span>角色卡 (Cards)</span>
                    </div>
                    <span id="badge-cards" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                </button>

                <button onclick="switchTab('worldbooks')" id="tab-worldbooks" class="tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                    <div class="flex items-center gap-3">
                        <i data-lucide="book-open" class="w-4 h-4 text-emerald-400"></i>
                        <span>世界书 (Worldbooks)</span>
                    </div>
                    <span id="badge-worldbooks" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                </button>

                <button onclick="switchTab('scenarios')" id="tab-scenarios" class="tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                    <div class="flex items-center gap-3">
                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
                        <span>小剧场 (Scenarios)</span>
                    </div>
                    <span id="badge-scenarios" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                </button>

                <button onclick="switchTab('regex')" id="tab-regex" class="tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                    <div class="flex items-center gap-3">
                        <i data-lucide="code-2" class="w-4 h-4 text-rose-400"></i>
                        <span>酒馆正则 (Regex)</span>
                    </div>
                    <span id="badge-regex" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                </button>

                <button onclick="switchTab('docs')" id="tab-docs" class="tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/60 transition">
                    <div class="flex items-center gap-3">
                        <i data-lucide="file-text" class="w-4 h-4 text-sky-400"></i>
                        <span>文档/文本 (Docs)</span>
                    </div>
                    <span id="badge-docs" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
                </button>
            </div>

            <div class="pt-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                数据存储于浏览器 IndexedDB<br>支持纯前端离线运行
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-hidden bg-slate-950/40">
            <!-- Search & Filter Bar -->
            <div class="p-4 glass border-b border-slate-800/60 flex items-center justify-between gap-4 shrink-0">
                <div class="relative flex-1 max-w-md">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderItems()" placeholder="搜索名称、描述或关键词..." class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div class="text-xs text-slate-400" id="itemCountText">加载中...</div>
            </div>

            <!-- Items Grid -->
            <div id="itemsContainer" class="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 custom-scrollbar">
                <!-- Dynamically populated -->
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700/80 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
                <div class="flex items-center gap-3">
                    <span id="modalCategoryBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">分类</span>
                    <h2 id="modalTitle" class="text-lg font-bold text-slate-100">详情</h2>
                </div>
                <button onclick="closeModal()" class="p-1 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Content -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar" id="modalBody">
                <!-- Dynamically filled -->
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-800 bg-slate-900/80 flex items-center justify-between shrink-0">
                <button onclick="deleteCurrentItem()" class="px-4 py-2 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10 transition flex items-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span>删除资产</span>
                </button>
                <div class="flex items-center gap-2" id="modalExportActions">
                    <!-- Dynamic Export Buttons -->
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic Script -->
    <script>
        // Init Lucide
        lucide.createIcons();

        let db;
        let currentTab = 'cards';
        let currentItem = null;

        // Init IndexedDB
        const request = indexedDB.open('TavernCardHubDB', 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('assets')) {
                const store = db.createObjectStore('assets', { keyPath: 'id' });
                store.createIndex('category', 'category', { unique: false });
            }
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            updateBadges();
            renderItems();
        };

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('bg-indigo-600/20', 'text-indigo-300', 'border', 'border-indigo-500/30'));
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) activeBtn.classList.add('bg-indigo-600/20', 'text-indigo-300', 'border', 'border-indigo-500/30');
            renderItems();
        }

        // Handle File Input
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (let file of files) {
                await processFile(file);
            }
            updateBadges();
            renderItems();
            e.target.value = '';
        });

        async function processFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            const id = 'asset_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            if (ext === 'png') {
                const arrayBuffer = await file.arrayBuffer();
                const jsonText = extractCharaChunk(arrayBuffer);
                let cardData = {};
                if (jsonText) {
                    try { cardData = JSON.parse(jsonText); } catch(err){}
                }
                const blob = new Blob([arrayBuffer], { type: 'image/png' });
                const imgUrl = URL.createObjectURL(blob);

                const name = cardData.data?.name || cardData.name || file.name.replace('.png', '');
                const firstMes = cardData.data?.first_mes || cardData.first_mes || '';
                const worldbook = cardData.data?.character_book || cardData.character_book || null;
                const regexScripts = cardData.data?.extensions?.regex_scripts || cardData.extensions?.regex_scripts || null;

                const asset = {
                    id, category: 'cards', name, fileType: 'png',
                    imgUrl, cardData, firstMes, worldbook, regexScripts,
                    rawText: JSON.stringify(cardData, null, 2), createdAt: Date.now()
                };
                await saveAsset(asset);

            } else if (ext === 'json') {
                const text = await file.text();
                let json = {};
                try { json = JSON.parse(text); } catch(err){}

                let category = 'cards';
                let name = file.name.replace('.json', '');

                if (json.entries || json.character_book) {
                    category = 'worldbooks';
                    name = json.name || name;
                } else if (Array.isArray(json) && json[0]?.scriptName) {
                    category = 'regex';
                } else if (json.data?.name || json.name) {
                    category = 'cards';
                    name = json.data?.name || json.name;
                } else if (json.scenario || json.prompt) {
                    category = 'scenarios';
                }

                const asset = {
                    id, category, name, fileType: 'json',
                    cardData: json, rawText: text, createdAt: Date.now(),
                    firstMes: json.data?.first_mes || json.first_mes || '',
                    worldbook: json.data?.character_book || json.character_book || (category === 'worldbooks' ? json : null),
                    regexScripts: json.data?.extensions?.regex_scripts || json.extensions?.regex_scripts || (category === 'regex' ? json : null)
                };
                await saveAsset(asset);

            } else if (ext === 'txt') {
                const text = await file.text();
                const asset = {
                    id, category: 'docs', name: file.name, fileType: 'txt',
                    rawText: text, createdAt: Date.now()
                };
                await saveAsset(asset);

            } else if (ext === 'docx') {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer });
                const asset = {
                    id, category: 'docs', name: file.name, fileType: 'docx',
                    rawText: result.value, createdAt: Date.now()
                };
                await saveAsset(asset);
            }
        }

        // PNG tEXt Chunk Extractor
        function extractCharaChunk(arrayBuffer) {
            const dataView = new DataView(arrayBuffer);
            let offset = 8; // Skip PNG Signature
            while (offset < dataView.byteLength) {
                const length = dataView.getUint32(offset);
                const type = String.fromCharCode(
                    dataView.getUint8(offset + 4),
                    dataView.getUint8(offset + 5),
                    dataView.getUint8(offset + 6),
                    dataView.getUint8(offset + 7)
                );
                if (type === 'tEXt') {
                    const chunkData = new Uint8Array(arrayBuffer, offset + 8, length);
                    let nullIndex = -1;
                    for (let i = 0; i < chunkData.length; i++) {
                        if (chunkData[i] === 0) { nullIndex = i; break; }
                    }
                    if (nullIndex !== -1) {
                        const keyword = new TextDecoder('iso-8859-1').decode(chunkData.subarray(0, nullIndex));
                        if (keyword === 'chara' || keyword === 'ccv3') {
                            const textData = chunkData.subarray(nullIndex + 1);
                            const base64Str = new TextDecoder('iso-8859-1').decode(textData);
                            return decodeURIComponent(escape(atob(base64Str)));
                        }
                    }
                }
                offset += 12 + length;
            }
            return null;
        }

        function saveAsset(asset) {
            return new Promise((resolve) => {
                const tx = db.transaction('assets', 'readwrite');
                tx.objectStore('assets').put(asset);
                tx.oncomplete = () => resolve();
            });
        }

        function getAllAssets() {
            return new Promise((resolve) => {
                const tx = db.transaction('assets', 'readonly');
                const store = tx.objectStore('assets');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
            });
        }

        async function updateBadges() {
            const assets = await getAllAssets();
            const counts = { cards: 0, worldbooks: 0, scenarios: 0, regex: 0, docs: 0 };
            assets.forEach(a => { if (counts[a.category] !== undefined) counts[a.category]++; });
            for (let cat in counts) {
                const el = document.getElementById(`badge-${cat}`);
                if (el) el.innerText = counts[cat];
            }
        }

        async function renderItems() {
            const assets = await getAllAssets();
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            const filtered = assets.filter(a => a.category === currentTab && (
                a.name.toLowerCase().includes(keyword) ||
                (a.rawText && a.rawText.toLowerCase().includes(keyword))
            ));

            document.getElementById('itemCountText').innerText = `共 ${filtered.length} 个资产`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-500">
                        <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                        <p class="text-sm">暂无资产，支持点击右上角导入 PNG/JSON/TXT/DOCX</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-4 flex flex-col justify-between cursor-pointer group";
                card.onclick = () => openModal(item);

                let coverHtml = '';
                if (item.imgUrl) {
                    coverHtml = `<div class="h-40 rounded-xl overflow-hidden bg-slate-900 mb-3 border border-slate-800">
                        <img src="${item.imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>`;
                } else {
                    coverHtml = `<div class="h-28 rounded-xl bg-slate-900/60 mb-3 border border-slate-800 flex items-center justify-center text-slate-600">
                        <i data-lucide="${item.fileType === 'docx' || item.fileType === 'txt' ? 'file-text' : 'code'}" class="w-8 h-8"></i>
                    </div>`;
                }

                card.innerHTML = `
                    <div>
                        ${coverHtml}
                        <h3 class="font-bold text-sm text-slate-200 truncate group-hover:text-indigo-400 transition">${item.name}</h3>
                        <p class="text-xs text-slate-400 line-clamp-2 mt-1">${item.firstMes || item.rawText || '暂无文字描述'}</p>
                    </div>
                    <div class="flex items-center justify-between mt-4 text-[10px] text-slate-500 border-t border-slate-800/60 pt-2">
                        <span class="uppercase font-mono">${item.fileType}</span>
                        <span>${new Date(item.createdAt).toLocaleDateString()}</span>
                    </div>`;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function openModal(item) {
            currentItem = item;
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalCategoryBadge').innerText = item.category.toUpperCase();

            const modalBody = document.getElementById('modalBody');
            const exportActions = document.getElementById('modalExportActions');
            modalBody.innerHTML = '';
            exportActions.innerHTML = '';

            // Card Image
            if (item.imgUrl) {
                const imgDiv = document.createElement('div');
                imgDiv.className = "flex justify-center bg-slate-950 p-4 rounded-xl border border-slate-800";
                imgDiv.innerHTML = `<img src="${item.imgUrl}" class="max-h-64 rounded-lg object-contain">`;
                modalBody.appendChild(imgDiv);

                const btnDownloadImg = document.createElement('a');
                btnDownloadImg.href = item.imgUrl;
                btnDownloadImg.download = `${item.name}.png`;
                btnDownloadImg.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center gap-1.5 transition";
                btnDownloadImg.innerHTML = `<i data-lucide="image" class="w-3.5 h-3.5"></i> 导出卡面 PNG`;
                exportActions.appendChild(btnDownloadImg);
            }

            // 开场白
            if (item.firstMes) {
                const mesBox = document.createElement('div');
                mesBox.className = "space-y-1.5";
                mesBox.innerHTML = `
                    <div class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">开场白 (First Message)</div>
                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 leading-relaxed max-h-36 overflow-y-auto custom-scrollbar">${item.firstMes}</div>`;
                modalBody.appendChild(mesBox);
            }

            // 世界书
            if (item.worldbook) {
                const wbBox = document.createElement('div');
                wbBox.className = "space-y-1.5";
                wbBox.innerHTML = `
                    <div class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">附加世界书 (Worldbook)</div>
                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 font-mono max-h-40 overflow-y-auto custom-scrollbar whitespace-pre-wrap">${JSON.stringify(item.worldbook, null, 2)}</div>`;
                modalBody.appendChild(wbBox);
            }

            // 酒馆正则
            if (item.regexScripts) {
                const regexBox = document.createElement('div');
                regexBox.className = "space-y-1.5";
                regexBox.innerHTML = `
                    <div class="text-xs font-semibold text-rose-400 uppercase tracking-wider">绑定酒馆正则 (Regex Scripts)</div>
                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 font-mono max-h-40 overflow-y-auto custom-scrollbar whitespace-pre-wrap">${JSON.stringify(item.regexScripts, null, 2)}</div>`;
                modalBody.appendChild(regexBox);
            }

            // 原始 JSON / 文本
            if (item.rawText) {
                const rawBox = document.createElement('div');
                rawBox.className = "space-y-1.5";
                rawBox.innerHTML = `
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">完整 JSON / 设定文本</div>
                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 font-mono max-h-48 overflow-y-auto custom-scrollbar whitespace-pre-wrap">${item.rawText}</div>`;
                modalBody.appendChild(rawBox);

                // Export JSON / Text button
                const blob = new Blob([item.rawText], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const btnDownloadJson = document.createElement('a');
                btnDownloadJson.href = url;
                btnDownloadJson.download = `${item.name}.${item.fileType === 'docx' ? 'txt' : 'json'}`;
                btnDownloadJson.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white flex items-center gap-1.5 transition shadow-md shadow-indigo-600/20";
                btnDownloadJson.innerHTML = `<i data-lucide="download" class="w-3.5 h-3.5"></i> 导出拆分 JSON/TXT`;
                exportActions.appendChild(btnDownloadJson);
            }

            document.getElementById('detailModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            currentItem = null;
        }

        async function deleteCurrentItem() {
            if (!currentItem) return;
            const tx = db.transaction('assets', 'readwrite');
            tx.objectStore('assets').delete(currentItem.id);
            tx.oncomplete = () => {
                closeModal();
                updateBadges();
                renderItems();
            };
        }
    </script>
</body>
</html>
